name: Cost Janitor

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  cost-janitor:
    name: Scan for orphaned resources
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.4
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,sts
          DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: janitor/requirements.txt

      - name: Install Python dependencies
        run: pip install -r janitor/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Install terraform-local
        run: pip install terraform-local

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        env:
          TF_VAR_region: us-east-1
        run: tflocal init

      - name: Terraform validate
        working-directory: terraform
        run: tflocal validate

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_region: us-east-1
        run: tflocal apply -auto-approve

      - name: Run unit tests
        working-directory: janitor
        run: pytest tests/ -v

      - name: Run Cost Janitor dry-run
        id: janitor
        working-directory: janitor
        run: |
          python janitor.py \
            --dry-run \
            --region us-east-1 \
            --endpoint-url http://localhost:4566 \
            --output ./output
        continue-on-error: true

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-janitor-report
          path: |
            janitor/output/report.json
            janitor/output/report.md
          retention-days: 30

      - name: Post PR comment with findings
        if: github.event_name == 'pull_request' && steps.janitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'janitor/output/report.md';
            if (!fs.existsSync(reportPath)) { return; }
            const body = fs.readFileSync(reportPath, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## Cost Janitor found orphaned resources\n\n" + body,
            });

      - name: Fail if orphans found
        if: steps.janitor.outcome == 'failure'
        run: |
          echo "::error::Cost Janitor detected orphaned resources."
          exit 1
